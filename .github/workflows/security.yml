name: Security

on:
  push:
    branches: ["origin", "main"]
  pull_request:
  schedule:
    # Weekly, Mondays 06:17 UTC — catches newly disclosed CVEs.
    - cron: "17 6 * * 1"

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

jobs:
  sast:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: Run bandit
        # Fail on medium+ findings; low-severity notes stay visible in the log.
        run: bandit -r . -x ./.git -ll

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        # Pinned by commit SHA; gitleaks exits non-zero when it finds a leak.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
